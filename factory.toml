# ソフトウェアファクトリーの設定。
# 秘密情報（APIキー・GitHub App の秘密鍵など）はここに書かず、環境変数で渡す。
# 項目の説明: specs/001-foundation/contracts/factory-toml.md

[llm]
# さくらのAI Engine の OpenAI 互換エンドポイント（仮の値。002 のスモークテストで確かめて直す）
base_url = "https://api.ai.sakura.ad.jp/v1"
max_attempts = 3                # 最初の1回を含む試行回数の上限（1〜10）
max_retry_delay_seconds = 60    # サーバーの待ち時間の指示がこれを超えたら再試行しない（1〜600）
request_timeout_seconds = 300   # 1回の試行の時間の上限（10〜1800）

[models]
# モデル名（仮の値。002 で実機の正確な名前に直す）
planner = "Kimi-K2.7-Code"     # 計画役（ツールなし・1回呼び出し）
implementer = "Kimi-K2.7-Code" # 実装役
verifier = "Qwen3.6"           # 検査役（実装役とは別系統）
# verifier_alt = "gemma-4"     # 検査役の比較用（012 の pnpm run eval:dev だけで使う。implementer と同じ値は不可）
fallback = "gpt-oss-120b"      # プレビューモデル停止時の退避先

[budget]
monthly_requests = 3000   # 月のリクエスト上限
per_job_requests = 100    # 1ジョブのリクエスト上限
timezone = "Asia/Tokyo"   # 月の区切りに使うタイムゾーン

[limits]
judge_retries = 2              # 判定不合格のやり直しの上限
ci_retries = 2                 # CI 失敗後のやり直しの上限
max_turns_per_phase = 40       # 1工程のターン数の上限
job_timeout_minutes = 60       # ジョブ全体の時間の上限
ci_wait_timeout_minutes = 30   # CI 待ちの時間の上限

[auto_merge]
# 出荷前チェックの条件。項目の説明: specs/008-ship-and-report/contracts/factory-toml.md
max_diff_lines = 300   # これを超える diff は Draft PR にする
# 変更したら自動マージしないパス（glob）。.github/workflows の下は push もしない（App に権限がない）
# .gitleaks.toml・.gitleaksignore は CI の秘密情報スキャンの許可が変わるので人間に見せる
forbidden_paths = [
  ".github/workflows/**",
  ".env*",
  "**/pnpm-lock.yaml",
  "**/package-lock.json",
  "**/yarn.lock",
  "deploy/**",
  ".gitleaks.toml",
  ".gitleaksignore",
]
allowed_work_types = ["bugfix", "test", "docs", "refactor"]   # 自動マージを許す作業の種類
skip_label = "no-auto-merge"   # Issue にこのラベルがあれば Draft にする

[github]
allowed_users = ["Coxless"]   # @agent を実行できるユーザー（書き込み権限の確認に加えて絞る）
webhook_max_body_kb = 1024     # Webhook の本文の上限（64〜25600）。項目の説明: specs/007-github-intake/contracts/factory-toml.md
max_instruction_chars = 20000  # 依頼の本文（@agent のあと）の上限（100〜200000）

[worker]
poll_interval_seconds = 5   # キューを見る間隔（1〜300）。受付が積んだときは待たずに取り出す

[storage]
database_path = "data/factory.db"   # 相対パスはこのファイルのディレクトリが基準
trace_dir = "data/traces"
work_dir = "data/work"   # ジョブごとの作業ディレクトリ（作業場から bind mount する）
eval_dir = "data/evals"  # 回帰評価（pnpm run eval:dev）の結果のファイル。項目の説明: specs/012-evals/contracts/factory-toml.md

[log]
level = "info"   # trace / debug / info / warn / error / fatal

[http]
# 待ち受け。項目の説明: specs/006-vps-ops/contracts/factory-toml.md
# Caddy から転送するので、外から直接届かないループバックにする。port は deploy/Caddyfile と合わせる
host = "127.0.0.1"
port = 8787
shutdown_timeout_seconds = 10   # 停止の合図のあと、処理中の要求を待つ上限（1〜60）

[sandbox]
# 作業場（ジョブ専用コンテナ）。項目の説明: specs/003-sandbox-tools/contracts/factory-toml.md
image = "factory-sandbox:latest"   # pnpm run sandbox:build で作る
# user = "1001:1001"               # 実行ユーザー。省略時はファクトリーと同じ uid:gid（root は不可）
cpus = 2
memory_mb = 2048
pids_limit = 512
tmp_size_mb = 512                  # /tmp（HOME）の大きさ
install_timeout_seconds = 600      # 依存のインストールの時間の上限

[tools]
bash_timeout_seconds = 120         # bash の時間の上限（既定）
bash_max_timeout_seconds = 600     # bash で指定できる時間の上限の最大
read_max_lines = 2000              # read_file が1回で返す行数
max_output_chars = 20000           # これを超えるツールの結果は先頭と末尾を残して切り詰める
# 書き込みを拒否するパス（glob）。auto_merge.forbidden_paths とは別の一覧
deny_write_paths = [
  ".git", ".git/**", "**/.git/**",
  ".github/workflows/**",
  ".env*", "**/.env*",
  "**/pnpm-lock.yaml", "**/package-lock.json", "**/yarn.lock",
  "deploy/**",
]

[implementer]
# 実装役のハーネス。項目の説明: specs/004-implementer-agent/contracts/factory-toml.md
# 既定の値は仮の値。012 の回帰評価と AI解禁後の実機の調整で直す
max_consecutive_blocks = 5   # 検査の拒否がこの回数続いたら止める
compaction_ratio = 0.7       # 入力がコンテキストの上限のこの割合を超えたら古いツールの結果を縮める
keep_recent_turns = 4        # 圧縮で残す直近のターン数
max_agents_md_chars = 20000  # AGENTS.md を入力に入れるときの上限（文字）
max_issue_chars = 20000      # Issue 文の上限
max_plan_chars = 20000       # 計画の上限
max_feedback_chars = 30000   # 追加のフィードバック（合計）の上限

[pipeline]
# 計画から判定までの工程。項目の説明: specs/005-local-pipeline/contracts/factory-toml.md
# 既定の値は仮の値。012 の回帰評価と AI解禁後の実機の調整で直す
# 工程内テストのコマンド（作業場の中で sh -c で順に実行。最初に失敗したところで止める）
# 対象リポジトリの CI と同じコマンドにする。空にすると工程内テストを飛ばす
check_commands = ["pnpm run check"]
check_timeout_seconds = 600   # 1コマンドの時間の上限（10〜3600）。ジョブの期限が先に来ればそちら
max_check_feedbacks = 3       # 1回の実装工程で、テストの失敗を実装役に差し込む回数の上限（0〜10）
max_check_log_chars = 8000    # 差し込み・判定に渡すテストのログの上限（先頭と末尾を残す）
max_diff_chars = 40000        # 検査役・やり直しに渡す diff の上限
max_file_list_chars = 10000   # 計画役に渡すファイル一覧の上限
# 依存のインストールのコマンド（ネットワークありの一時的な作業場で sh -c で1回実行。007）
# 対象リポジトリの CI と同じにする。空にするとインストールを飛ばす
install_command = "pnpm install --frozen-lockfile"
